# kres generates the workflows for the self-hosted runners of Sidero Labs,
# so this one is written by hand. It runs the same steps on a GitHub-hosted runner.

name: build
"on":
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
        with:
          # the version of the build comes from the tags
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # version: v4.4.1
      # The version file is checked against the last tag, which a release does not have
      # yet when its pull request is built. The tag is taken from its commit message then.
      - name: CI temp release tag
        if: github.event_name == 'pull_request'
        run: |
          make ci-temp-release-tag
      - name: Check dirty
        if: github.event_name == 'pull_request'
        run: |
          make check-dirty
      - name: unit-tests
        run: |
          make unit-tests
      - name: unit-tests-race
        run: |
          make unit-tests-race
      - name: lint
        run: |
          make lint
      - name: fibonacci-service
        run: |
          make fibonacci-service
      - name: image-fibonacci-service
        run: |
          make image-fibonacci-service
      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # version: v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}
      - name: push-fibonacci-service
        if: github.event_name != 'pull_request'
        env:
          PLATFORM: linux/amd64,linux/arm64
          PUSH: "true"
        run: |
          make image-fibonacci-service
      - name: push-fibonacci-service-latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PLATFORM: linux/amd64,linux/arm64
          PUSH: "true"
        run: |
          make image-fibonacci-service IMAGE_TAG=latest
  # The policies of .conform.yaml, for every commit of a pull request and not only for the last one.
  conform:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # version: v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # the last commit of the pull request, and not the merge commit GitHub makes of it
          ref: ${{ github.event.pull_request.head.sha }}
      - name: install conform
        env:
          CONFORM_VERSION: v0.1.0-alpha.33
        run: |
          cd "${RUNNER_TEMP}"

          url="https://github.com/siderolabs/conform/releases/download/${CONFORM_VERSION}"
          curl -fsSL --retry 3 -o conform-linux-amd64 "${url}/conform-linux-amd64"
          curl -fsSL --retry 3 -o conform-sha256sum.txt "${url}/sha256sum.txt"
          grep " conform-linux-amd64$" conform-sha256sum.txt | sha256sum -c -

          install -m 0755 conform-linux-amd64 conform
      - name: conform
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          "${RUNNER_TEMP}/conform" enforce --base-branch="origin/${BASE_REF}" --commit-ref="refs/remotes/origin/${BASE_REF}"
