---
kind: common.Repository
spec:
  conformGPGSignatureCheck: false
  enableAIPolicy: false
  enableLefthook: false
  skipStaleWorkflow: true
  projectAutoAdd:
    enabled: false
---
kind: common.Image
name: image-fibonacci-service
spec:
  additionalImages: []
  extraEnvironment:
    PLATFORM: linux/amd64,linux/arm64
---
kind: golang.Build
spec:
  outputs:
    linux-amd64:
      GOOS: linux
      GOARCH: amd64
    linux-arm64:
      GOOS: linux
      GOARCH: arm64
---
kind: golang.Generate
spec:
  versionPackagePath: internal/version
---
kind: service.CodeCov
spec:
  enabled: false
